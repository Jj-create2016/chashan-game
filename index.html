.scene{flex:1;position:relative;overflow:hidden}

.tree{position:absolute;width:25%;aspect-ratio:1;border-radius:50%;cursor:pointer;

  transition:transform .12s;user-select:none;pointer-events:auto;z-index:2}
.tree:active{transform:scale(.93)}
.tree:nth-child(1){top:2%;left:6%}
.tree:nth-child(2){top:2%;left:37.5%}
.tree:nth-child(3){top:2%;left:69%}
.tree:nth-child(4){top:26%;left:4%}
.tree:nth-child(5){top:26%;left:37.5%}
.tree:nth-child(6){top:26%;left:71%}
.tree:nth-child(7){top:50%;left:6%}
.tree:nth-child(8){top:50%;left:37.5%}

.tree .leaf{position:absolute;font-size:26px;pointer-events:none;
  transition:transform .55s ease-out,opacity .55s ease-out;
  filter:drop-shadow(0 2px 3px rgba(0,0,0,.35));z-index:3}
.tree .leaf:nth-of-type(1){top:-6%;left:50%;transform:translateX(-50%) rotate(-15deg)}
.tree .leaf:nth-of-type(2){top:8%;right:-8%;transform:rotate(25deg)}
.tree .leaf:nth-of-type(3){bottom:8%;right:-8%;transform:rotate(-25deg)}
.tree .leaf:nth-of-type(4){bottom:-6%;left:50%;transform:translateX(-50%) rotate(15deg)}
.tree .leaf:nth-of-type(5){bottom:8%;left:-8%;transform:rotate(25deg)}
.tree .leaf:nth-of-type(6){top:8%;left:-8%;transform:rotate(-25deg)}
.tree .leaf:nth-of-type(7){top:50%;right:-10%;transform:translateY(-50%) rotate(0deg);font-size:22px}
.tree .leaf:nth-of-type(8){top:50%;left:-10%;transform:translateY(-50%) rotate(0deg);font-size:22px}
.tree .leaf.fly{transform:translateY(100px) rotate(360deg) scale(1.4);opacity:0}
.tree .flower{position:absolute;font-size:15px;pointer-events:none;z-index:4;

.tree .flower:nth-of-type(8){bottom:-4%;left:-10%;animation-delay:1.5s}

.connect-decor{position:absolute;font-size:22px;pointer-events:none;z-index:4;

  filter:drop-shadow(0 2px 3px rgba(0,0,0,.3));

function getLevelConfig(chapterId,levelNum){
  const chapter=CHAPTERS.find(function(c){return c.id===chapterId;});
  if(!chapter)return null;
  const isBoss=levelNum%10===0;
  const diff=1+(levelNum-1)*0.12;
  return {
    chapter:chapter,
    level:levelNum,
    isBoss:isBoss,
    hpMul:diff,
    spdMul:1+(levelNum-1)*0.008,
    targetKills:8+Math.floor(levelNum/2),
    waveCount:3+Math.floor(levelNum/15),
    bossHpMul:isBoss?8:0,
    reward:20+levelNum*2+(isBoss?50:0)
  };
}

/* ---------- 工具 ---------- */
function $(s){return document.querySelector(s);}
function $$(s){return Array.prototype.slice.call(document.querySelectorAll(s));}

function toast(msg){
  const d=document.createElement('div');
  d.className='toast';
  d.textContent=msg;
  document.body.appendChild(d);
  setTimeout(function(){d.remove();},1600);
}
function floatText(x,y,text,color){
  const d=document.createElement('div');
  d.className='float';
  d.textContent=text;
  d.style.left=x+'px';
  d.style.top=y+'px';
  if(color)d.style.color=color;
  document.body.appendChild(d);
  setTimeout(function(){d.remove();},900);
}
function save(){
  try{localStorage.setItem('chashan_v4',JSON.stringify(S));}catch(e){}
}
function load(){
  try{
    const raw=localStorage.getItem('chashan_v4');
    if(raw)Object.assign(S,JSON.parse(raw));
  }catch(e){}
  const allChars=ALL_CHARS.concat(FESTIVALS.reduce(function(acc,f){
    return acc.concat(f.chars);
  },[]));
  allChars.forEach(function(c){
    if(!Array.isArray(S.bag[c])||S.bag[c].length!==MAX_LV){
      S.bag[c]=new Array(MAX_LV).fill(0);
    }
  });
  if(!S.bag['茶'][0])S.bag['茶'][0]=1;
  if(!localStorage.getItem('chashan_v4'))S.tea=30;
}
function topLevel(c){
  const a=S.bag[c];
  if(!a)return 0;
  for(let i=MAX_LV-1;i>=0;i--){if(a[i]>0)return i+1;}
  return 0;
}
function addChar(c,lv){
  if(lv===undefined)lv=1;
  if(!S.bag[c])S.bag[c]=new Array(MAX_LV).fill(0);
  const i=Math.min(Math.max(lv,1),MAX_LV)-1;
  S.bag[c][i]++;
}
function dropChar(){
  const fest=activeFestival();
  const pool=ALL_CHARS.slice();
  const weights=Object.assign({},DROP_W);
  if(fest){
    fest.chars.forEach(function(c){pool.push(c);weights[c]=30;});
  }
  const total=pool.reduce(function(s,c){return s+(weights[c]||5);},0);
  let r=Math.random()*total;
  for(let i=0;i<pool.length;i++){
    const c=pool[i];
    r-=(weights[c]||5);
    if(r<=0){addChar(c,1);return c;}
  }
  addChar('茶',1);
  return '茶';
}

let curChapter='lake';

function openAdventure(){
  if(!S.progress)S.progress={lake:1,waterfall:0,forest:0};
  go('screen-levels');
  renderLevelSelect();
}

function renderLevelSelect(){
  if(!S.progress)S.progress={lake:1,waterfall:0,forest:0};
  const tabs=$('#chapterTabs');
  if(!tabs)return;
  tabs.innerHTML='';
  CHAPTERS.forEach(function(ch){
    const b=document.createElement('button');
    b.type='button';
    const unlocked=S.progress[ch.id]>0||ch.id==='lake';
    b.textContent=ch.emoji+' '+ch.name;
    b.className=(ch.id===curChapter?'on':'')+(unlocked?'':' locked');
    b.addEventListener('click',function(){
      if(!unlocked){toast('需要先通关上一章');return;}
      curChapter=ch.id;
      renderLevelSelect();
    });
    tabs.appendChild(b);
  });
  const chapter=CHAPTERS.find(function(c){return c.id===curChapter;});
  const progress=S.progress[curChapter]||0;
  const ct=$('#chapterTitle');
  if(ct)ct.textContent=chapter.desc+' · 已通关 '+Math.max(0,progress-1)+'/50';

  const grid=$('#levelGrid');
  if(!grid)return;
  grid.innerHTML='';
  for(let i=1;i<=50;i++){
    const cell=document.createElement('div');
    const isBoss=i%10===0;
    const cleared=i<progress;
    const isCurrent=i===progress;
    const isLocked=i>progress;
    cell.className='lv-cell'+(cleared?' cleared':'')+(isBoss?' boss':'')+(isLocked&&!isCurrent?' locked':'')+(isCurrent?' current':'');
    if(isBoss&&!isLocked){
      cell.innerHTML='👹<span class="boss-tag">BOSS</span>';
    }else{
      cell.textContent=i;
    }
    cell.addEventListener('click',function(){
      if(isLocked&&!isCurrent){toast('需要先通关前一关');return;}
      startLevel(curChapter,i);
    });
    grid.appendChild(cell);
  }
}

function startLevel(chapterId,levelNum){
  TD.curChapter=chapterId;
  TD.curLevel=levelNum;
  const cfg=getLevelConfig(chapterId,levelNum);
  if(!cfg)return;
  TD.levelConfig=cfg;
  TD.baseHp=10;TD.wave=1;TD.kills=1;TD.waveKills=0;TD.waveSpawned=0;
  TD.waveTarget=Math.min(60,8+Math.floor(levelNum*3));
  TD.festMission={active:false,festId:null,kills:0,target:cfg.targetKills};
  clearMonsters();
  go('screen-path');
  toast('第 '+levelNum+' 关'+(cfg.isBoss?' · BOSS 战':''));
}

function completeLevel(){
  const cfg=TD.levelConfig;
  if(!cfg)return;
  const chapterId=cfg.chapter.id;
  const levelNum=cfg.level;
  if(S.progress[chapterId]<=levelNum){
    S.progress[chapterId]=levelNum+1;
    if(chapterId==='lake'&&levelNum===50&&S.progress.waterfall===0)S.progress.waterfall=1;
    if(chapterId==='waterfall'&&levelNum===50&&S.progress.forest===0)S.progress.forest=1;
  }
  S.tea+=cfg.reward;
  save();
  const nextLevel=levelNum+1;
  let msg='<div class="celebrate"><div class="big">🎉</div>'+
    '<span class="fest-tag">第 '+levelNum+' 关通关</span>'+
    '<h3>奖励 '+cfg.reward+' 🍃</h3>';
  if(levelNum===50){
    msg+='<p>恭喜通关「'+cfg.chapter.name+'」！</p>';
    if(chapterId==='lake')msg+='<p>解锁第二章：飞瀑</p>';
    else if(chapterId==='waterfall')msg+='<p>解锁第三章：原始森林</p>';
    else msg+='<p>三章全通关，你是茶山之王！</p>';
    msg+='<button type="button" class="btn-main" id="lvBack">返回关卡</button>';
  }else{
    msg+='<p>下一关：第 '+nextLevel+' 关'+(nextLevel%10===0?'（BOSS）':'')+'</p>'+
      '<button type="button" class="btn-main" id="lvNext">下一关</button>'+
      '<button type="button" class="btn-main" id="lvBack" style="margin-top:8px;background:#e2e9e0;color:#5a6b5c;box-shadow:none">返回关卡</button>';
  }
  msg+='</div>';
  openModal(msg);
  const nb=document.getElementById('lvNext');
  if(nb)nb.addEventListener('click',function(){closeModal();startLevel(chapterId,nextLevel);});
  const bb=document.getElementById('lvBack');
  if(bb)bb.addEventListener('click',function(){closeModal();openAdventure();});
}

    (function(idx){

        '<span class="flower">🌼</span>'+
        '<div class="cd"></div>';
      d.addEventListener('click',function(ev){pickTea(idx,ev);});
      g.appendChild(d);
      trees.push({el:d,cd:0,leaves:8,leavesDom:d.querySelectorAll('.leaf')});
    })(i);
  }
  const decor=[
    {x:33,y:6,e:'🌸'},{x:67,y:6,e:'🌼'},
    {x:16,y:30,e:'🍃'},{x:55,y:30,e:'🌸'},{x:88,y:30,e:'🍃'},
    {x:33,y:50,e:'🌼'},{x:67,y:50,e:'🌸'},
    {x:16,y:70,e:'🌸'},{x:55,y:70,e:'🍃'},{x:88,y:70,e:'🌼'},
    {x:33,y:88,e:'🍃'},{x:67,y:88,e:'🌸'}
  ];
  decor.forEach(function(d){
    const el=document.createElement('span');
    el.className='connect-decor';
    el.style.left=d.x+'%';
    el.style.top=d.y+'%';
    el.textContent=d.e;
    g.appendChild(el);
  });
}

function pickTea(i,ev){
  const t=trees[i];
  if(!t)return;
  if(t.cd>0){toast('茶树还在成熟中，请稍等～');return;}
  if(!t.leaves||t.leaves<=0){toast('叶子已摘完');return;}
  const leafEl=t.leavesDom[t.leaves-1];
  if(leafEl){
    leafEl.classList.add('fly');
    setTimeout(function(){if(leafEl)leafEl.classList.remove('fly');},600);
  }
  t.leaves--;

 let gain=2+S.equip.basket;
  if(Math.random() < 0.05 * getTalentCount('朴实之力')) { gain += 1; }
  const fest=activeFestival();
  if(fest && S.unlockedFests[fest.id]){
    gain = Math.round(gain * (1.5 + 0.5 * getTalentCount('茶神之赐')));
  }
  if(Math.random() < 0.10 * getTalentCount('熟练采集')) { dropChar(); }
  if(Math.random() < 0.15 * getTalentCount('双倍幸运')) { dropChar(); }
  S.tea+=gain;
SFX.pick();
  SFX.leaf();
  const ch=dropChar();
  const rect=t.el.getBoundingClientRect();
  floatText(rect.left+rect.width/2-20,rect.top+rect.height/2-8,'+'+gain+'🍃');
  if(ch)toast('采到字：「'+ch+'」');

  if(t.leaves<=0){
    t.cd = TREE_CD * Math.max(0.5, 1 - 0.05 * getTalentCount('轻快步伐'));
    t.el.classList.add('cool');
  }

  checkFestUnlock();
  save();
  refreshUI();
}

function investHouse(){
  if(S.tea<10){toast('茶叶不足 10');return;}
  S.tea-=10;
  S.houseProg+=1;
  if(S.houseProg>=10){
    S.houseProg=0;
    S.houseLevel++;
    toast('茶楼升级！Lv.'+S.houseLevel+' 每秒产茶 +'+S.houseLevel);
  }
  save();
  refreshUI();
}

function loadChapterMap(){
  const grid=$('#tdGrid');
  if(!grid)return;
  let mapData=null;
  if(TD.festMission.active&&FEST_MAPS[TD.festMission.festId]){
    mapData=FEST_MAPS[TD.festMission.festId];
  }else{
    const chapter=TD.curChapter
      ?CHAPTERS.find(function(c){return c.id===TD.curChapter;})
      :CHAPTERS[0];
    if(!chapter)return;
    mapData=chapter;
  }
  const pathArr=mapData.path;
  const towerArr=mapData.towers;
  PATH.length=0;
  pathArr.forEach(function(p){PATH.push(p);});
  grid.innerHTML='';
  const pathSet={};
  pathArr.forEach(function(p){pathSet[p.row+','+p.col]=1;});
  const towerMap={};
  towerArr.forEach(function(p,i){towerMap[p.row+','+p.col]=i;});
  TD.slots=[];
  for(let r=0;r<4;r++){
    for(let c=0;c<4;c++){
      const d=document.createElement('div');
      d.className='cell';
      const key=r+','+c;
      if(r===pathArr[0].row&&c===pathArr[0].col){d.classList.add('start');d.textContent='入';}
      else if(r===pathArr[pathArr.length-1].row&&c===pathArr[pathArr.length-1].col){d.classList.add('goal');d.textContent='🏯';}
      else if(pathSet[key]){d.classList.add('path');}
      else if(towerMap[key]!==undefined){
        d.classList.add('tower');
        d.dataset.slot=towerMap[key];
      }
      grid.appendChild(d);
    }
  }
  towerArr.forEach(function(p,i){
    const el=grid.children[p.row*4+p.col];
    TD.slots[i]={el:el,row:p.row,col:p.col,unit:null};
  });
  grid.onclick=function(e){
    const cell=e.target.closest('.cell.tower');
    if(!cell)return;
    const idx=parseInt(cell.dataset.slot,10);
    if(!isNaN(idx))clickSlot(idx);
  };
  const scene=document.querySelector('.td-scene');
  if(scene)scene.style.background=mapData.bg;
  const fill=document.querySelectorAll('.cell.path');
  fill.forEach(function(el){
    el.style.background='linear-gradient(180deg,'+mapData.pathFill+','+mapData.pathBorder+')';
  });
}

function saveLakeTower(){
  S.lakeTower={
    wave:TD.wave,waveTarget:TD.waveTarget,waveKills:TD.waveKills,
    kills:TD.kills,baseHp:TD.baseHp,
    slots:TD.slots.map(function(s){
      if(s&&s.unit){
        return {char:s.unit.char,lv:s.unit.lv,cost:s.unit.cost,
          cd:s.unit.cd||0,skillT:s.unit.skillT||0,
          buffFastT:s.unit.buffFastT||0,buffDmgT:s.unit.buffDmgT||0,
          heavyHit:s.unit.heavyHit||false,moonStep:s.unit.moonStep||0};
      }
      return null;
    })
  };
  save();
}

function restoreLakeTower(){
  if(!S.lakeTower)return false;
  TD.wave=S.lakeTower.wave||1;
  TD.waveTarget=S.lakeTower.waveTarget||8;
  TD.waveKills=S.lakeTower.waveKills||0;
  TD.kills=S.lakeTower.kills||1;
  TD.baseHp=S.lakeTower.baseHp||10;
  TD.waveSpawned=0;
  if(S.lakeTower.slots){
    S.lakeTower.slots.forEach(function(u,i){
      if(u&&TD.slots[i]){
        TD.slots[i].unit={char:u.char,lv:u.lv,cost:u.cost,cd:u.cd,
          skillT:u.skillT,buffFastT:u.buffFastT,buffDmgT:u.buffDmgT,
          heavyHit:u.heavyHit,moonStep:u.moonStep};
      }
    });
  }
  return true;
}

function syncSlotUI(){
  TD.slots.forEach(function(slot){
    if(!slot||!slot.el)return;
    if(slot.unit){
      const def=UNIT_DEFS[slot.unit.char];
      const isMyth=MYTH_CHARS.indexOf(slot.unit.char)>=0;
      slot.el.classList.add('filled');
      slot.el.innerHTML='<span class="unit-icon">'+(def?def.icon:'🍃')+'</span>'+
        '<span class="lv-badge">L'+slot.unit.lv+'</span>'+
        (isMyth?'<span class="my-badge">仙</span>':'');
    }else{
      slot.el.classList.remove('filled');
      slot.el.innerHTML='';
    }
  });
}

function renderHand(){
  const row=$('#handRow');
  if(!row)return;
  row.innerHTML='';
  const fest=activeFestival();
let avail=Object.keys(UNIT_DEFS).filter(function(c){
    if(topLevel(c)<1)return false;
    if(FEST_CHARS.indexOf(c)>=0){
      return fest && fest.chars.indexOf(c)>=0;
    }
    return true;
  });
  if(avail.length===0){
    row.innerHTML='<div style="font-size:11.5px;color:#83978a;padding:14px 4px">还没有可上阵的茶字，去采茶吧！</div>';
    return;
  }

  avail.forEach(function(c){
    const def=UNIT_DEFS[c];
    const lv=topLevel(c);
    const cost=def.cost+Math.max(0,lv-1)*3;
    const can=S.tea>=cost;
    const isMyth=MYTH_CHARS.indexOf(c)>=0;
    const d=document.createElement('div');
    d.className='hand-card'+(TD.selectedChar===c?' sel':'')+(can?'':' dis')+(isMyth?' myth':'');
    d.innerHTML='<div class="ic">'+def.icon+'</div>'+
      '<div class="nm">'+def.name+'</div>'+
      '<div class="cost">'+cost+'🍃</div>';
    d.addEventListener('click',function(){
      if(!can){toast('茶叶不足');return;}
      TD.selectedChar=(TD.selectedChar===c?null:c);
      renderHand();
    });
    row.appendChild(d);
  });
}

function clickSlot(i){
  const slot=TD.slots[i];
  if(!slot)return;
  if(slot.unit){
    showUnitInfo(i);
    return;
  }
  if(!TD.selectedChar){toast('先在下方选择一个茶字');return;}
  const c=TD.selectedChar;
  const def=UNIT_DEFS[c];
  if(!def){toast('该字无法上阵');return;}
  const lv=topLevel(c);
  const cost=def.cost+Math.max(0,lv-1)*3;
  if(S.tea<cost){toast('茶叶不足');return;}
  S.tea-=cost;

  		slot.unit={char:c,lv:lv,cost:cost,cd:0,skillT:0,buffFastT:0,buffDmgT:0,heavyHit:false};
  TD.selectedChar=null;
  syncSlotUI();
  renderHand();
  refreshUI();
  save();
  if(c==='娲')toast('女娲降临，每隔片刻催熟茶树！');
}

function triggerSkill(slot){
  const c=slot.unit.char;
  const bonus=1+(slot.unit.lv-1)*0.15;

  if(c==='茶'){
    if(TD.baseHp<10){TD.baseHp=Math.min(10,TD.baseHp+1);refreshUI();}
  }
  else if(c==='绿'){
    if(TD.baseHp<10){TD.baseHp=Math.min(10,TD.baseHp+Math.round(3*bonus));refreshUI();}
    toast('绿茶使：生命之泉');
  }
  else if(c==='红'){
    slot.unit.heavyHit=true;
    toast('红茶卫：蓄力一击');
  }
  else if(c==='白'){
    TD.monsters.forEach(function(m){if(!m.dead)m.slowT=Math.max(m.slowT,2);});
    toast('白茶师：寒霜入茶，全场冻结');
  }
  else if(c==='黑'){
    TD.monsters.forEach(function(m){if(!m.dead)damageMonster(m,8*bonus);});
    toast('黑茶将：浓香一击');
  }
  else if(c==='青'){
    for(let k=0;k<3;k++){
      (function(k){
        setTimeout(function(){
          const target=TD.monsters.find(function(m){return !m.dead;});

function spawnMonster(){
  const layer=$('#monsterLayer');

  let emojis=['🌿','🍄','🪴'];
  const curFest=activeFestival();
  let skinId=null;
  if(TD.festMission.active&&TD.festMission.festId)skinId=TD.festMission.festId;
  else if(curFest&&S.festSkins[curFest.id])skinId=curFest.id;
  if(skinId&&FEST_MONSTER_SKINS[skinId])emojis=FEST_MONSTER_SKINS[skinId];
  const types=[
    {emoji:emojis[0],hp:1.0,spd:0.55},
    {emoji:emojis[1],hp:1.5,spd:0.45},
    {emoji:emojis[2],hp:2.2,spd:0.36}
  ];
  const t=types[Math.min(types.length-1,Math.floor(Math.random()*(1+TD.wave/3)))];
  const cfgMul=cfg?cfg.hpMul:1;
  const maxhp=Math.round((6+TD.wave*4)*t.hp*cfgMul*(isBoss?8:1));
  const el=document.createElement('div');
  el.className='monster'+(isBoss?' boss':'');

    speed:t.spd*(isBoss?0.7:1),
    row:0,col:0,
    slowT:0,dead:false,boss:isBoss
  };
  el.addEventListener('click',function(){hitMonster(m);});
  layer.appendChild(el);
  TD.monsters.push(m);
  updateMonsterPosition(m);
}

function updateMonsterPosition(m){
  const idx=Math.floor(m.progress);
  const frac=m.progress-idx;
  const a=PATH[Math.min(idx,PATH.length-1)];
  const b=PATH[Math.min(idx+1,PATH.length-1)];
  m.row=a.row+(b.row-a.row)*frac;
  m.col=a.col+(b.col-a.col)*frac;
  m.el.style.left=((m.col+0.5)*25)+'%';
  m.el.style.top=((m.row+0.5)*25)+'%';
}
  
function getTalentCount(name){
  if(!S.talentCards || !S.talentCards[name]) return 0;
  const base = S.talentCards[name].count;
  if(name === '世界树的祝福') return base;
  const worldTree = S.talentCards['世界树的祝福'] ? S.talentCards['世界树的祝福'].count : 0;
  return base * (1 + worldTree * 0.5);
}

function unitDamage(u, m){
  const def=UNIT_DEFS[u.char]||{dmg:2};
  let dmg=(def.dmg+(u.lv-1)*2)*(1+S.equip.pestle*0.15);
  if(u.buffDmgT>0)dmg*=1.5;
  let atkBonus = 0.12 * getTalentCount('利刃加持');
  let bossBonus = (m && m.boss) ? (0.30 * getTalentCount('法穿铭文')) : 0;
  dmg *= (1 + atkBonus + bossBonus);
  return dmg;
}

function hitMonster(m){
  if(m.dead)return;
  const d=2+topLevel('茶')+(S.equip.pestle*2);
  damageMonster(m,d);
}
function damageMonster(m,dmg,color){
  if(m.dead||!m.el)return;
  m.hp-=dmg;
  const bar=m.el.querySelector('.hp i');
  if(bar)bar.style.width=Math.max(0,m.hp/m.maxhp*100)+'%';
  m.el.classList.add('hurt');
  setTimeout(function(){if(m.el)m.el.classList.remove('hurt');},100);
  if(dmg>0){
    const r=m.el.getBoundingClientRect();
    floatText(r.left+r.width/2-8,r.top-4,'-'+Math.round(dmg),color||'#e0453a');
  }
  if(m.hp<=0)killMonster(m);
}
function killMonster(m){
  m.dead=true;
  if(m.el)m.el.remove();
  const gain=m.boss?15:3;
  S.tea+=gain;
  S.kills++;
  if(TD.festMission.active){
    TD.festMission.kills++;
    const fm=TD.festMission;
    const fmap=FEST_MAPS[fm.festId];
    if(fmap){
      if(!fm.miniBossSpawned&&fm.kills===fmap.miniBoss.atKill){
        fm.miniBossSpawned=true;
        setTimeout(function(){spawnFestBoss(fmap.miniBoss,false);},300);
      }
      if(!fm.bossSpawned&&fm.kills===fmap.boss.atKill){
        fm.bossSpawned=true;
        setTimeout(function(){spawnFestBoss(fmap.boss,true);},300);
      }
    }
    if(fm.kills>=fm.target){
      setTimeout(winFestMission,400);
    }
  }
  TD.kills++;
  TD.waveKills=(TD.waveKills||0)+1;
  if(Math.random()<(m.boss?0.9:0.35))dropChar();
const targetKills=TD.levelConfig?TD.levelConfig.targetKills:24;
  if(TD.levelConfig&&!TD.festMission.active&&TD.kills>=targetKills){
    setTimeout(completeLevel,400);
    return;
  }
	if(TD.waveKills>=TD.waveTarget){
    TD.waveKills=0;
    TD.wave++;
    TD.waveTarget=Math.min(60,Math.ceil(TD.waveTarget*1.5));
    TD.waveSpawned=0;
    if(TD.wave>S.bestWave){S.bestWave=TD.wave;submitScore();}
    toast('第 '+TD.wave+' 波来袭！· 需击杀 '+TD.waveTarget+' 只');
  }
  save();
  refreshUI();
}

function autoMergeAll(){
  const all=ALL_CHARS.concat(FEST_CHARS);
  let totalMerged=0;
  all.forEach(function(c){
    if(!S.bag[c])return;
    let changed=true;
    while(changed){
      changed=false;
      for(let i=0;i<MAX_LV-1;i++){
        if(S.bag[c][i]>=2){
          const pairs=Math.floor(S.bag[c][i]/2);
          S.bag[c][i]-=pairs*2;
          S.bag[c][i+1]+=pairs;
          totalMerged+=pairs;
          changed=true;
        }
      }
    }
  });
  if(totalMerged>0){
    save();
    checkFestUnlock();
    refreshUI();
    renderHand();
    toast('一键合成：合并 '+totalMerged+' 次');
    setTimeout(function(){renderBag();},100);
  }else{
    toast('没有可合成的印记');
  }
}

function utf8ToBase64(str){
  return btoa(unescape(encodeURIComponent(str)));
}
function base64ToUtf8(b64){
  return decodeURIComponent(escape(atob(b64)));
}

function restoreSaveCode(code){
  try{
    const raw=base64ToUtf8(code);
    const data=JSON.parse(raw);
    if(!data||typeof data!=='object')throw new Error('无效');
    Object.keys(data).forEach(function(k){S[k]=data[k];});
    save();
    closeModal();
    toast('存档已恢复，即将刷新…');
    setTimeout(function(){location.reload();},800);
  }catch(e){
    toast('存档码无效或已损坏');
  }
}

let actx=null;
let sfxLast={};
function initAudio(){
  if(actx)return;
  try{actx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}
}
function beep(freq,dur,type,vol,sweep){
  try{
    if(!actx || actx.state==='suspended'){
      try{ if(actx) actx.close(); }catch(e){}
      actx=new (window.AudioContext||window.webkitAudioContext)();
    }
    const o=actx.createOscillator();
    const g=actx.createGain();
    o.type=type||'sine';
    o.frequency.value=freq;
    const t0=actx.currentTime;
    if(sweep)o.frequency.exponentialRampToValueAtTime(Math.max(sweep,1),t0+dur);
    g.gain.setValueAtTime(vol||0.12,t0);
    g.gain.exponentialRampToValueAtTime(0.001,t0+dur);
    o.connect(g);g.connect(actx.destination);
    o.start(t0);o.stop(t0+dur);
  }catch(e){}
}
function sfxThrottle(key,minGap){
  const now=Date.now();
  if(sfxLast[key]&&now-sfxLast[key]<(minGap||60))return false;
  sfxLast[key]=now;
  return true;
}

function rollTalentRarity(){
  const r=Math.random();
  if(r<0.001)return 'rainbow';
  if(r<0.021)return 'gold';
  if(r<0.121)return 'purple';
  if(r<0.341)return 'blue';
  if(r<0.641)return 'green';
  return 'white';
}

function draw3Talents(){
  const arr=[];
  for(let i=0;i<3;i++){
    const rar=rollTalentRarity();
    const pool=TALENT_POOL.filter(function(t){return t.r===rar;});
    const pick=pool[Math.floor(Math.random()*pool.length)];
    arr.push(pick);
  }
  return arr;
}

  });
  openModal(html);

function answerQuiz(pick,c){
  if(!currentQuiz||currentQuiz.c!==c)return;
  const q=currentQuiz.q;
  const right=q.r;
  const btns=modalBody.querySelectorAll('.quiz-opt');
  btns.forEach(function(b,i){
    b.disabled=true;
    if(i===right)b.classList.add('right');
    else if(i===pick)b.classList.add('wrong');
  });
  if(pick===right){
    const lv=Math.max(1,topLevel(c));
    addChar(c,Math.min(lv+1,MAX_LV));
    toast('答对啦！印记 +1');
    setTimeout(function(){
      checkFestUnlock();
      save();
      renderBag();
      refreshUI();
      renderHand();
    },700);
  }else{
    setTimeout(function(){
      openModal('<div class="celebrate">'+
        '<div class="big">😅</div>'+
        '<h3>差一点点</h3>'+
        '<p>正确答案是「'+String.fromCharCode(65+right)+'」。<br>再来一次吧，茶山不赶时间。</p>'+
        '<button type="button" class="btn-main" id="retryQuiz">再答一题</button>'+
      '</div>');
      const rb=document.getElementById('retryQuiz');
      if(rb)rb.addEventListener('click',function(){quiz(c);});
    },800);
  }
}

function fetchRankList(cb){
  try{
    const xhr=new XMLHttpRequest();
	xhr.open('GET',RANK_API,true);
    xhr.timeout=8000;
    xhr.onload=function(){
      try{
        const data=JSON.parse(xhr.responseText);
        cb(Array.isArray(data.list)?data.list:[]);
      }catch(e){cb(null);}
    };
    xhr.onerror=function(){cb(null);};
    xhr.ontimeout=function(){cb(null);};
    xhr.send();
  }catch(e){cb(null);}
}

  const now = Date.now();
  if(now - lastSubmit < 5000) return;

  const name = getPlayerName();
  const score = S.bestWave;
  if(score < 1) return;

  try {
    const res = await window.app.callFunction({
      name: 'submitScore',
      data: { name: name, score: score }

      console.log('✅ 分数已提交到云端！');

          '<div class="rank-no">' + medal + '</div>' +
          '<div class="rank-name">' + r.name + (me ? ' <span style="color:#c9a227;font-size:10px">(我)</span>' : '') + '</div>' +
          '<div>第 ' + r.score + ' 波</div>' +
        '</div>';
      });
    }
    html += '<p class="tip" style="margin-top:12px;text-align:center">数据来自云端，实时共享</p>';
    openModal(html);
    const rn = document.getElementById('rankRename');
    if(rn) rn.addEventListener('click', renamePlayer);
  } catch (error) {
    console.error('❌ 获取排行榜失败:', error);
    openModal('<h3>🏅 茶山排行榜</h3><p class="tip" style="color:#c9182b">加载失败: ' + (error.message || '网络问题') + '</p>');
  }
}

function renamePlayer(){

    '<div style="display:flex;gap:8px">'+
      '<button type="button" class="btn-main" id="nameSave" style="flex:1;padding:12px;font-size:13px;margin-top:0">保存</button>'+
      '<button type="button" class="btn-main" id="nameCancel" style="flex:1;padding:12px;font-size:13px;margin-top:0;background:#e2e9e0;color:#5a6b5c;box-shadow:none">取消</button>'+
    '</div>');

function equipCost(k){const e=EQUIPS[k];return e.base+e.inc*S.equip[k];}

function openShop(){
  let html='<h3>🎒 商店 · 装备</h3><p class="tip">当前茶叶：<b>'+S.tea+'</b> 🍃</p>';
  Object.keys(EQUIPS).forEach(function(k){
    const e=EQUIPS[k];
    const lv=S.equip[k];
    const cost=equipCost(k);
    html+='<div class="shop-item">'+
      '<div class="shop-icon">'+e.icon+'</div>'+
      '<div class="shop-info">'+
        '<b>'+e.name+' <span style="color:#c9a227">Lv.'+lv+'</span></b>'+
        '<p>'+e.desc+'</p>'+
      '</div>'+
      '<button type="button" class="shop-buy" data-eq="'+k+'"'+(S.tea>=cost?'':' disabled')+'>'+cost+'🍃</button>'+
    '</div>';
  });
  openModal(html);
  modalBody.querySelectorAll('.shop-buy[data-eq]').forEach(function(btn){
    btn.addEventListener('click',function(){buyEquip(btn.dataset.eq);});
  });
}
function buyEquip(k){
  const cost=equipCost(k);
  if(S.tea<cost){toast('茶叶不足');return;}
  S.tea-=cost;
  S.equip[k]++;
  toast(EQUIPS[k].name+' 升级到 Lv.'+S.equip[k]);
  save();
  openShop();
  refreshUI();
  renderHand();
}

function todayKey(){
  const d=new Date();
  return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
}
function openSign(){
  const signed=S.lastSign===todayKey();
  const rewards=[10,15,20,25,30,40,80];
  const streak=S.signStreak%7;
  let html='<h3>📅 每日签到</h3><p class="tip">连续签到奖励更丰厚，第 7 天送 80 茶叶</p><div class="sign-grid">';
  for(let i=0;i<7;i++){
    const done=i<streak;
    html+='<div class="sign-day'+(done?' done':'')+'">'+
      '<span>'+(done?'✓':'🍃')+'</span>第'+(i+1)+'天<br>'+rewards[i]+
    '</div>';
  }
  html+='</div>';
  if(signed){
    html+='<button type="button" class="btn-main" disabled>今日已签到</button>';
  }else{
    html+='<button type="button" class="btn-main" id="doSignBtn">签到领 '+rewards[streak]+' 茶叶</button>';
  }
  openModal(html);
  const sb=document.getElementById('doSignBtn');
  if(sb)sb.addEventListener('click',doSign);
}
function doSign(){
  const k=todayKey();
  if(S.lastSign===k){toast('今天已经签过啦');return;}
  const rewards=[10,15,20,25,30,40,80];
  const gain=rewards[S.signStreak%7];
  S.tea+=gain;
  S.signStreak++;
  S.lastSign=k;
  toast('签到成功！获得 '+gain+' 茶叶');
  save();
  openSign();
  refreshUI();
}

/* ---------- 全局刷新 ---------- */
function refreshUI(){
  $$('.tea-val').forEach(function(e){e.textContent=S.tea;});
  const ht=$('#homeTea');if(ht)ht.textContent=S.tea;
  const hb=$('#homeBest');if(hb)hb.textContent=S.bestWave;
  const hl=$('#houseLv');if(hl)hl.textContent=S.houseLevel;
  const hbar=$('#houseBar');if(hbar)hbar.style.width=(S.houseProg*10)+'%';
  const wn=$('#waveNum');if(wn)wn.textContent=TD.wave;
const wkn=$('#waveKillNum');if(wkn)wkn.textContent=TD.waveKills||0;
const wtn=$('#waveTargetNum');if(wtn)wtn.textContent=TD.waveTarget||8;
  const bh=$('#baseHp');if(bh)bh.textContent=Math.max(0,TD.baseHp);

	const bfm=$('#btnFestMission');
  if(bfm){
    const cf=activeFestival();
    if(TD.festMission.active){
      bfm.textContent='🎊 任务中 '+TD.festMission.kills+'/'+TD.festMission.target;
      bfm.style.background='linear-gradient(135deg,#c9182b,#7a1010)';
    }else if(cf&&S.unlockedFests[cf.id]){
      bfm.textContent='🎊 开启「'+cf.name+'」专属任务';
      bfm.style.background='linear-gradient(135deg,#e6a020,#c9182b)';
    }else{
      bfm.textContent='🎊 节日任务（未开放）';
      bfm.style.background='#bbb';
    }
  }

  const un=$('#unitNum');
  if(un)un.textContent=TD.slots.filter(function(s){return s&&s.unit;}).length;

  const fest=activeFestival();
  const mt=$('#mtTitle');
  if(mt){
    let title='第一站 · 云雾茶山';
    if(fest&&S.unlockedFests[fest.id])title+='<span class="fest-badge">'+fest.name+'</span>';
    const hasMyth=TD.slots.some(function(s){
      return s&&s.unit&&MYTH_CHARS.indexOf(s.unit.char)>=0;
    });
    if(hasMyth)title+='<span class="myth-badge">仙临</span>';
    mt.innerHTML=title;
  }

  const fc=$('#festChip');
  if(fc){
    if(fest&&S.unlockedFests[fest.id]){
      fc.style.display='';
      fc.textContent=fest.emoji+' '+fest.name+' · 收益+50%';
    }else if(fest){
      fc.style.display='';
      fc.textContent=fest.emoji+' '+fest.name+' · 集字解锁';
    }else{
      fc.style.display='none';
    }
  }
}

/* ---------- 主循环 ---------- */
let houseAcc=0;

setInterval(function(){
  /* 茶树冷却 */
trees.forEach(function(t){
    if(t.cd>0){
      t.cd-=0.1;
      const cd=t.el.querySelector('.cd');
      if(cd)cd.style.opacity=Math.min(1,t.cd/TREE_CD);
      if(t.cd<=0){
        t.cd=0;
        t.el.classList.remove('cool');
        t.leaves=8;
        if(cd)cd.style.opacity=0;
      }
    }
  });

  /* 茶楼自动产茶 */
  if(S.houseLevel>0){
    houseAcc+=0.1;
    if(houseAcc>=1){
      houseAcc-=1;
		S.tea += S.houseLevel + 2 * getTalentCount('永恒之火');
      refreshUI();
      save();
    }
  }

  /* 女娲催熟：每 6 秒一次 */
  const hasNuwa=TD.slots.some(function(s){
    return s&&s.unit&&s.unit.char==='娲';
  });
  if(TD.active&&hasNuwa){
    nuwaAcc+=0.1;
    if(nuwaAcc>=6){nuwaAcc=0;triggerNuwa();}
  }else{
    nuwaAcc=0;
  }

/* 塔防 */
  if(TD.active){
    TD.spawnT-=0.1;
    TD.spawnT-=0.1;
    if(TD.spawnT<=0){
      if((TD.waveSpawned||0)<TD.waveTarget){
        spawnMonster();
        TD.waveSpawned=(TD.waveSpawned||0)+1;
        if(TD.waveSpawned%10===0){
          TD.spawnT=1.8;
        }else{
          TD.spawnT=0.15;
        }
      }else{
        TD.spawnT=0.6;
      }
    }

    for(let i=TD.monsters.length-1;i>=0;i--){
      const m=TD.monsters[i];
      if(m.dead){TD.monsters.splice(i,1);continue;}
      if(m.slowT>0)m.slowT-=0.1;
      else{
        m.progress+=m.speed*0.13;
        updateMonsterPosition(m);
      }
      if(m.progress>=PATH.length-1)leakMonster(m);
    }


    /* 技能触发 */
    TD.slots.forEach(function(slot){
      if(!slot||!slot.unit)return;
      const def=UNIT_DEFS[slot.unit.char];
      if(!def||!def.sk)return;
      slot.unit.skillT=(slot.unit.skillT||0)+0.1;
if(slot.unit.skillT >= (def.sk * Math.max(0.4, 1 - 0.1 * getTalentCount('技能强化')))){
        slot.unit.skillT=0;
        triggerSkill(slot);
      }
      if(slot.unit.buffFastT>0)slot.unit.buffFastT-=0.1;
      if(slot.unit.buffDmgT>0)slot.unit.buffDmgT-=0.1;
    });

    TD.slots.forEach(function(slot){
      if(!slot||!slot.unit)return;
      const def=UNIT_DEFS[slot.unit.char];
      if(!def||def.type==='heal'||def.type==='mature')return;
      slot.unit.cd-=0.1;
      if(slot.unit.cd>0)return;
      const gridRange=def.range/10;
      const target=TD.monsters.find(function(m){
        if(m.dead)return false;
        const dr=m.row-slot.row, dc=m.col-slot.col;
        return Math.sqrt(dr*dr+dc*dc)<=gridRange;
      });
		if(target)SFX.attack();
      if(target){
        slot.unit.cd=(slot.unit.buffFastT>0)?(1/(def.rate*(1+0.15*getTalentCount('速攻节奏')))/2):(1/def.rate);
        let finalDmg=unitDamage(slot.unit, target);
        if(slot.unit.heavyHit){finalDmg*=2;slot.unit.heavyHit=false;}
fireProjectile(slot,target,def);
if(def.type==='aoe'){
          TD.monsters.filter(function(m){
            if(m.dead)return false;
            const dr=m.row-target.row, dc=m.col-target.col;
            return Math.sqrt(dr*dr+dc*dc)<1.5;
          }).forEach(function(m){damageMonster(m,finalDmg);});
        }else if(def.type==='slow'){
          damageMonster(target,finalDmg,'#6ab8ff');
          target.slowT=1.5;
        }else if(def.type==='crit'){
          const crit=Math.random()<0.3;
          damageMonster(target,finalDmg*(crit?(3+0.5*getTalentCount('暴击之心')):1),crit?'#e6a020':null);
        }else{
          damageMonster(target,finalDmg);
        }
      }
    });

    TD.slots.forEach(function(slot){
      if(!slot||!slot.unit)return;
      const def=UNIT_DEFS[slot.unit.char];
      if(!def||def.type!=='heal')return;
      slot.unit.cd-=0.1;
      if(slot.unit.cd>0)return;
      slot.unit.cd=1/def.rate;
      if(TD.baseHp<10){
        TD.baseHp=Math.min(10,TD.baseHp+unitHeal(slot.unit));
        refreshUI();
      }
    });
  }
},100);

if(btnSave)btnSave.addEventListener('click',openSaveCode);

  if(btnBackMountain)btnBackMountain.addEventListener('click',function(){go('screen-mountain');});

 if(btnToPath)btnToPath.addEventListener('click',function(){

    TD.curChapter='lake';

const btnManualSave=$('#btnManualSave');

	const btnFestMission=$('#btnFestMission');

  /* 点击遮罩关闭弹窗 */
  modal.addEventListener('click',function(e){
    if(e.target===modal)closeModal();
  });
